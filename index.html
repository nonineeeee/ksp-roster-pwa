<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>高軟保全4日排班</title>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="logo">4D</div>
    <div>
      <h1>高雄軟體園區<br>保全勤務排班</h1>
      <p>選人員＋白／晚班，一次套用4天＋零星調整</p>
    </div>
  </header>

  <section class="card api-card">
    <div class="row">
      <span>排班 API</span>
      <strong id="apiStatus" class="badge waiting">檢查中</strong>
    </div>
    <div class="row second">
      <span>目前月排班表</span>
      <strong id="monthStatus">讀取中…</strong>
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">新月份才使用</div>
        <h2>① 建立月份日期框架</h2>
      </div>
    </div>

    <div class="two">
      <div>
        <label for="year">年份</label>
        <input id="year" type="number" min="2020" max="2100">
      </div>
      <div>
        <label for="month">月份</label>
        <select id="month"></select>
      </div>
    </div>

    <div class="notice warn-note">
      只有切換到新月份時才按。會清除月排班表 A:W 並建立新月份日期，但保留 X「換班註記」及 Y「主管備註」。
    </div>

    <button id="prepareMonthBtn" class="btn outline">建立／切換此月份</button>
    <div id="monthMessage"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">主要排班方式</div>
        <h2>② 人員班別套用4天</h2>
      </div>
      <button id="reloadStaffBtn" class="text-btn">重讀人員</button>
    </div>

    <label for="startDate">4天起始日期</label>
    <input id="startDate" type="date">

    <div id="rangeText" class="range-text">請選擇起始日期</div>

    <div class="assign-builder">
      <label for="batchPerson">先選人員</label>
      <select id="batchPerson"></select>

      <div class="shift-choice">
        <button id="chooseDayBtn" class="shift-btn day" type="button">白班</button>
        <button id="chooseNightBtn" class="shift-btn night" type="button">晚班</button>
      </div>

      <div class="hint">
        每加入1人，就會套用到這4天。基本建議為「2位白班＋1位晚班」；第4位機動人員可選白班或晚班。
      </div>
    </div>

    <div id="batchAssignments" class="assignment-list"></div>

    <button id="save4Btn" class="btn primary">套用此班表到4天</button>
    <div id="fourDayMessage"></div>
  </section>

<section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">臨時請假／換班／支援</div>
        <h2>③ 零星調整</h2>
      </div>
    </div>

    <label for="singleDate">日期</label>
    <input id="singleDate" type="date">

    <label for="singleSlot">調整位置</label>
    <select id="singleSlot">
      <option value="early1">白班1</option>
      <option value="early2">白班2</option>
      <option value="night1">晚班1</option>
      <option value="mobile1">機動支援</option>
    </select>

    <label for="singlePerson">人員</label>
    <select id="singlePerson"></select>

    <div id="singleMobileShiftWrap" class="hidden">
      <label for="singleMobileShift">機動班別</label>
      <select id="singleMobileShift">
        <option value="白班">白班｜06:00–18:00</option>
        <option value="晚班">晚班｜18:00–次日06:00</option>
      </select>
    </div>

    <button id="saveSingleBtn" class="btn single-btn">套用零星調整</button>
    <div id="singleMessage"></div>
  </section>

<section class="card">
    <div class="section-head">
      <h2>④ 本月排班檢視</h2>
      <button id="loadMonthBtn" class="text-btn">重新整理</button>
    </div>
    <div id="monthRoster" class="month-list"></div>
  </section>

  <footer>高雄軟體園區保全勤務｜4天班快速排班 PWA</footer>
</main>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
