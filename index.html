<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>高軟保全4日排班</title>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="logo">4D</div>
    <div>
      <h1>高雄軟體園區<br>保全勤務排班</h1>
      <p>每4天排班一次＋零散排班</p>
    </div>
  </header>

  <section class="card api-card">
    <div class="row">
      <span>排班 API</span>
      <strong id="apiStatus" class="badge waiting">檢查中</strong>
    </div>
    <div class="row second">
      <span>目前月排班表</span>
      <strong id="monthStatus">讀取中…</strong>
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">新月份才使用</div>
        <h2>① 建立月份日期框架</h2>
      </div>
    </div>

    <div class="two">
      <div>
        <label for="year">年份</label>
        <input id="year" type="number" min="2020" max="2100">
      </div>
      <div>
        <label for="month">月份</label>
        <select id="month"></select>
      </div>
    </div>

    <div class="notice warn-note">
      只有切換到新月份時才按。會清除月排班表 A:W 並建立新月份日期，但保留 X「換班註記」及 Y「主管備註」。
    </div>

    <button id="prepareMonthBtn" class="btn outline">建立／切換此月份</button>
    <div id="monthMessage"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">主要排班方式</div>
        <h2>② 4日批次排班</h2>
      </div>
      <button id="reloadStaffBtn" class="text-btn">重讀人員</button>
    </div>

    <label for="startDate">起始日期</label>
    <input id="startDate" type="date">

    <button id="load4Btn" class="btn outline">載入這4天</button>

    <div class="notice">
      每次只處理「起始日＋後3天」。不會改動其他日期。
    </div>

    <div id="fourDayList" class="day-list"></div>

    <button id="save4Btn" class="btn primary hidden">儲存這4天排班</button>
    <div id="fourDayMessage"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <div>
        <div class="eyebrow">臨時請假／換班／支援</div>
        <h2>③ 零散排班</h2>
      </div>
    </div>

    <label for="singleDate">日期</label>
    <input id="singleDate" type="date">

    <label for="singleSlot">席次</label>
    <select id="singleSlot">
      <option value="early1">早班1｜06:00–18:00</option>
      <option value="early2">早班2｜06:00–18:00</option>
      <option value="night1">晚班1｜18:00–次日06:00</option>
      <option value="mobile1">機動班1</option>
    </select>

    <label for="singlePerson">人員</label>
    <select id="singlePerson"></select>

    <button id="saveSingleBtn" class="btn single-btn">套用零散排班</button>
    <div id="singleMessage"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>④ 本月排班檢視</h2>
      <button id="loadMonthBtn" class="text-btn">重新整理</button>
    </div>
    <div id="monthRoster" class="month-list"></div>
  </section>

  <footer>高雄軟體園區保全勤務｜4日批次排班 PWA</footer>
</main>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
